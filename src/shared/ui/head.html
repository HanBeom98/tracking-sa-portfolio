<style>
  html.dark-mode,
  html.dark-mode body {
    background-color: #0f172a;
    color: #f8fafc;
    color-scheme: dark;
  }
</style>
<script>
  (function() {
    let theme = 'dark';
    try {
      theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
    } catch {}
    if (theme === 'dark') {
      document.documentElement.classList.add('dark-mode');
      document.body && document.body.classList.add('dark-mode');
    }
  })();
</script>
