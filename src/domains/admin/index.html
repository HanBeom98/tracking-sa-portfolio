<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 | Tracking SA</title>
<meta name="description" content="Tracking SA 사이트 관리자 전용 운영 화면입니다.">
  <link rel="stylesheet" href="ui/dashboard.css">
</head>
<body>
  <main class="admin-wrap">
    <section id="adminGate" class="admin-gate" aria-labelledby="adminGateTitle">
      <h1 id="adminGateTitle">관리자 권한 확인 중</h1>
      <p id="adminGateMessage" role="status">로그인 상태와 사이트 관리자 권한을 확인하고 있습니다.</p>
      <div class="admin-actions"><button id="adminLogin" type="button" hidden>로그인</button><a href="/">홈으로</a></div>
    </section>
    <section id="adminDashboard" class="admin-frame" aria-label="사이트 운영 대시보드" hidden>
      <div class="admin-top"><div><strong>TRACKING <span>SA</span></strong><small>ADMIN CONSOLE</small></div><p>사이트 관리자 · <span id="adminName"></span></p></div>
      <div class="admin-layout">
        <nav class="admin-nav" aria-label="관리자 메뉴">
          <span class="admin-nav-label">WORKSPACE</span>
          <a href="#overview" data-admin-nav="overview">관리자 홈</a>
          <a href="#notices" data-admin-nav="notices">공지 관리</a>
          <a href="#applications" data-admin-nav="applications">리그 신청</a>
          <a href="#tools" data-admin-nav="tools">운영 바로가기</a>
          <a href="/stats/sudden-attack/league/" class="admin-league-link">리그 전체 관리 ↗</a>
        </nav>
        <div id="adminContent" class="admin-content" aria-live="polite"></div>
      </div>
      <p class="admin-footer">필요할 때 조회 · 자동 새로고침 없음</p>
    </section>
    <p id="adminFeedback" class="admin-feedback" role="status" hidden></p>
    <dialog id="applicationDecision" class="admin-dialog" aria-labelledby="decisionTitle" aria-describedby="decisionDescription">
      <h2 id="decisionTitle">리그 신청 확인</h2>
      <p id="decisionDescription"></p>
      <dl><dt>게임 닉네임</dt><dd id="decisionName"></dd><dt>플레이어 ID</dt><dd id="decisionOuid"></dd></dl>
      <p>승인 시 기존 멤버의 전적은 유지합니다. 반려하면 이 신청은 대기 목록에서 제외됩니다.</p>
      <div class="admin-actions"><button id="decisionConfirm" type="button" class="admin-primary">처리 확인</button><button id="decisionCancel" type="button">취소</button></div>
    </dialog>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
