<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contact">문의 - Tracking SA</title>
    <style>
        .contact-content { font-size: 1.1rem; line-height: 1.8; display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
        .contact-email-card { background: #f1f5f9; padding: 30px; border-radius: 20px; margin: 10px 0; text-align: center; }
        .contact-details-card { background: #ffffff; border: 1px solid #e2e8f0; padding: 18px 20px; border-radius: 14px; }
        .contact-response-time { font-size: 0.9rem; color: #64748b; text-align: center; }
        body.dark-mode .contact-email-card,
        body.dark-mode .contact-details-card { background: #1e293b; border-color: #475569; color: #f8fafc; }
        body.dark-mode .contact-response-time { color: #cbd5e1; }
    </style>
</head>
<body>
    <app-layout 
      data-i18n-attr="page-title:contact_us_title"
      page-title="문의하기">
        <div class="contact-content">
            <p data-i18n="contact_us_intro">질문, 피드백 또는 제휴 문의 사항이 있으시면 언제든지 저희에게 연락해 주십시오.</p>
            <div class="contact-email-card">
                <p style="margin: 0; font-size: 1.2rem;"><strong data-i18n="contact_us_email">이메일:</strong> <a href="mailto:demo-15b9ce4f@example.com" style="color: var(--link-color, #0052cc); font-weight: 800; text-decoration: none;">demo-15b9ce4f@example.com</a></p>
            </div>
            <div class="contact-details-card">
                <p style="margin: 0 0 8px 0;"><strong data-i18n="contact_operator_label">운영 주체:</strong> <span data-i18n="contact_operator_value">Tracking SA Team</span></p>
                <p style="margin: 0;"><strong data-i18n="contact_scope_label">문의 범위:</strong> <span data-i18n="contact_scope_value">서비스 오류, 정책 문의, 제휴/콘텐츠 제안</span></p>
            </div>
            <p class="contact-response-time" data-i18n="contact_us_response_time">모든 문의에 2-3 영업일 이내에 답변하는 것을 목표로 합니다.</p>
        </div>
    </app-layout>

    <script src="/ui/app-layout.js" type="module"></script>
</body>
</html>
