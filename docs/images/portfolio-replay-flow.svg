<text x="384" y="344.4" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">파일·참가자·기록 확인</text>
<text x="384" y="382.4" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">입력 오류는 다시 선택</text>
