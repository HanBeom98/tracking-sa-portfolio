<text x="984" y="344.4" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">시점 재생·선수 필터</text>
<text x="984" y="382.4" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">검증 지표·보류 사유</text>
<rect x="1260" y="255" width="260" height="225" rx="20" fill="#E8EDF5" stroke="none" stroke-width="2"/>
