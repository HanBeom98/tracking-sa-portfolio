<rect x="82" y="610" width="5" height="29" rx="2" fill="#087F79" stroke="none" stroke-width="2"/>
<text x="102" y="631.75" fill="#16283F" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="25" font-weight="700">JSON 1개  /  한 경기 복기</text>
<text x="84" y="682.01" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400">공식 총계와 검증된 라운드 지표의 출처를 구분</text>
<text x="84" y="720.01" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400">장면·선수·시점 선택 → 재생 / PNG / 인쇄·PDF</text>
<text x="84" y="758.01" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400">검증할 수 없는 구간은 판단을 보류</text>
<rect x="820" y="590" width="720" height="260" rx="20" fill="#E8EDF5" stroke="none" stroke-width="2"/>
<rect x="820" y="585" width="720" height="260" rx="20" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/>
<rect x="842" y="610" width="5" height="29" rx="2" fill="#245EDB" stroke="none" stroke-width="2"/>
<text x="862" y="631.75" fill="#16283F" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="25" font-weight="700">JSON 2~5개  /  같은 선수 비교</text>
<text x="844" y="682.01" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400">같은 OUID의 검증된 경기 기록으로 범위를 제한</text>
<text x="844" y="720.01" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400">기준·이후 경기 선택 → 라운드 가중 지표 비교</text>
<text x="844" y="758.01" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400">분석 파일을 교체하면 이전 비동기 결과의 반영 차단</text>
<rect x="60" y="885" width="1480" height="95" rx="16" fill="#E7F3F2" stroke="none" stroke-width="2"/>
<text x="84" y="924.14" fill="#087F79" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="22" font-weight="700">기본 분석·재생·비교는 기기 안에서 처리</text>
<text x="84" y="959.4" fill="#16283F" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">추가 경기 유형·전력 조회는 별도 API 경로입니다. 기본 규칙 분석을 생성형 AI 판단으로 표시하지 않습니다.</text>
