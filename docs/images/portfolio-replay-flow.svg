<text x="684" y="344.4" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">1개: 한 경기 분석</text>
<text x="684" y="382.4" fill="#52657B" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400">2~5개: 같은 선수 비교</text>
