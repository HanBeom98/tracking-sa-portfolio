name: Site Deploy (Test & Build)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      board_privacy_cleanup:
        description: "기존 게시글·댓글 이메일 정리 (private 백업 포함)"
        type: choice
        default: none
        options:
          - none
          - audit
          - apply

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared checks must pass before any production deployment.
  test:
    uses: ./.github/workflows/validate.yml

  # 2단계: 테스트 성공 시에만 빌드 및 배포
  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.repository == 'HanBeom98/tracking-sa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Firebase CLI
        if: github.event_name == 'workflow_dispatch'
        run: npm install -g firebase-tools@15.34.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Files & Firebase Config
        run: |
          set -euo pipefail
          echo "Checking directory structure..."
          ls -la
          echo "Verifying firebase.json content..."
          cat firebase.json
          test -f firestore.rules || { echo "firestore.rules missing"; exit 1; }

      - name: Build public site only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          BASE_URL: "https://trackingsa.com/"
        run: |
          set -euo pipefail
          python main.py --build-only

      - name: Verify Build Artifacts
        run: npm run check:build-artifacts

      # Never let a delayed run roll production back to an older main commit.
      - name: Verify latest main commit before remote mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$latest_main" ]; then
            echo "main has changed; this older run must not deploy."
            exit 1
          fi

      - name: Deploy Firestore Rules and Indexes
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Create temporary service account key file
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$HOME/firebase-sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-sa-key.json"
          
          # Deploy using global firebase-tools with explicit project and force flag
          firebase deploy --only firestore,storage --project demo-tracking-sa-portfolio --non-interactive
          
          # Cleanup
          rm "$HOME/firebase-sa-key.json"

      - name: Audit and clean legacy board emails
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.board_privacy_cleanup != 'none' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLEANUP_MODE: ${{ inputs.board_privacy_cleanup }}
        run: |
          set -euo pipefail
          if [ "$CLEANUP_MODE" = "apply" ]; then
            node scripts/migrate-board-privacy.mjs --apply
          else
            node scripts/migrate-board-privacy.mjs
          fi

      - name: Deploy to Cloudflare Pages (Direct Upload)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tracking-sa --branch=main --commit-hash=${{ github.sha }}
