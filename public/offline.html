<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0052cc">
    <title>오프라인 - Tracking SA</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
        main { width: min(100%, 560px); padding: 40px 28px; border: 1px solid #334155; border-radius: 24px; background: #1e293b; text-align: center; }
        img { width: 80px; height: 80px; }
        h1 { margin: 20px 0 12px; font-size: 2rem; }
        p { margin: 0; color: #cbd5e1; line-height: 1.7; }
        button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 10px; background: #0052cc; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icon-192.png" alt="">
        <h1>인터넷 연결을 확인해 주세요</h1>
        <p>Tracking SA의 전적과 최신 데이터는 인터넷 연결이 필요합니다. 연결을 확인한 뒤 다시 시도해 주세요.</p>
        <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
</body>
</html>
